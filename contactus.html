<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Roboto:ital,wdth,wght@0,75..100,100..900;1,75..100,100..900&display=swap"
        rel="stylesheet">
    <script src="jquery-3.7.1.min.js"></script>
    <script>
        $(function () {
            $("#header").load("header.html");
            $("#footer").load("footer.html");
        });
    </script>
</head>

<body>
    <!--Creating the connection with the header-->
    <div id="header"></div>

    <!--Creating a section "contact us" -->
    <main class="contact-us-bg">
        <div class="contact-us container ">
            <h1>Fale com a gente!</h1>
            <p class="txt-size1regular">Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptate alias
                repellendus
                dolor ad eius quisquam
                reiciendis.
            </p>
        </div>
    </main>
    <section class="contact-us-section">
        <div class="contact-us-socialmedia  borders">
            <h2>Redes Sociais:</h2>
            <div class="contact-us-socialmedia-icons">
                <a href="#"><img src="Resources/facebook-contato.svg" alt="" width="100" height="100"></a>
                <a href="#"><img src="Resources/instagram-contato.svg" alt="" width="100" height="100"></a>
            </div>

        </div>
        <div class="contact-us-message  borders">
            <h2>Mensagem:</h2>
            <form action="" class="contact-us-form">
                <input type="text" placeholder="Nome">
                <input type="email" placeholder="E-mail">
                <textarea name="" id="" placeholder="Mensagem"></textarea>
                <button class="main-button">ENVIAR</button>
            </form>
        </div>
    </section>

    <!--Creating the connection with the footer-->
    <div id="footer"></div>
</body>

</html>
